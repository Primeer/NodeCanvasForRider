# Any property can be overwritten from command-line via
#   -P<propertyName>=<value>

DotnetPluginId=ReSharperPlugin.NodeCanvasUsages
DotnetSolution=ReSharperPlugin.NodeCanvasUsages.sln
RiderPluginId=io.github.nodecanvasusages.rider
PluginVersion=0.1.0

BuildConfiguration=Debug

PublishToken="_PLACEHOLDER_"

# Target Rider version. ONE PLACE TO UPDATE together with SdkVersion in src/dotnet/Plugin.props
# (and since/until-build below). Available versions:
#   https://www.jetbrains.com/intellij-repository/releases (com.jetbrains.intellij.rider:riderRD)
ProductVersion=2025.3.4
# Compatible IDE builds (2025.3.x == 253.*)
SinceBuild=253
UntilBuild=253.*

# Optional: build/run against a locally installed Rider instead of downloading it (~3 GB), e.g.
#   ./gradlew runIde -PLocalRiderPath=/Applications/Rider.app
LocalRiderPath=

# Kotlin 1.4 will bundle the stdlib dependency by default, causing problems with the version bundled with the IDE
# https://blog.jetbrains.com/kotlin/2020/07/kotlin-1-4-rc-released/#stdlib-default
kotlin.stdlib.default.dependency=false

# Required to download Rider artifacts from Maven (and not "binary" releases from CDN).
org.jetbrains.intellij.platform.buildFeature.useBinaryReleases=false
